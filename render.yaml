databases:
  - name: dukaanai-db
    databaseName: dukaanai_db
    user: dukaanai_user
    plan: free
    region: singapore

services:
  - type: web
    name: dukaanai-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dukaanai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OTP_PROVIDER
        value: fast2sms
      - key: FAST2SMS_API_KEY
        value: PeW1QHZCQWdHfscirAsYG3xOf8VmLBNYaiwZ59Esv9bpulPmGCe7zY98URR4yqZGWD5biCgm90XskWzt
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_SECRET_PEPPER
        generateValue: true
